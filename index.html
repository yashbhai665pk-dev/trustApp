<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trust Wallet URL Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .box {
      text-align: center;
      padding: 30px;
    }

    button {
      border: 0;
      padding: 14px 22px;
      border-radius: 10px;
      background: #3375bb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Trust Wallet Test</h2>
    <p>Button dabao aur dekho Trust Wallet open hota hai ya nahi.</p>

    <button onclick="openTrustWallet()">
      Open in Trust Wallet
    </button>
  </div>

  <script>
    function openTrustWallet() {
      const coinId = 195;
      const siteUrl = "https://example.com";

      const trustUrl =
        `trust://open_url?coin_id=${coinId}&url=${encodeURIComponent(siteUrl)}`;

      window.location.href = trustUrl;
    }
  </script>

</body>
</html>
